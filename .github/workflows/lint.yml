name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

# Check-only: every step below fails the build instead of rewriting files.
# Fix locally with `vendor/bin/pint`, `npm run format`, and `npm run lint`.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Pint (PHP style)
        run: vendor/bin/pint --test

      - name: Prettier (frontend style)
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      # vue-tsc needs the gitignored Wayfinder output (resources/js/{actions,routes,wayfinder}).
      # Locally the Vite plugin generates it; here nothing runs Vite, so generate it directly.
      # The flags must match the wayfinder() options in vite.config.ts.
      - name: Generate Wayfinder types
        run: |
          cp .env.example .env
          php artisan wayfinder:generate --with-form

      - name: Type check
        run: npm run types
