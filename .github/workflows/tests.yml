name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check Required Secrets
        run: |
          if [ -z "${{ secrets.DB_TEST_USERNAME }}" ] || [ -z "${{ secrets.DB_TEST_PASSWORD }}" ] || [ -z "${{ secrets.DB_TEST_DATABASE }}" ]; then
            echo "::error::Required database secrets are not configured"
            echo "::error::Please configure the following secrets in your repository:"
            echo "::error::  - DB_TEST_USERNAME"
            echo "::error::  - DB_TEST_PASSWORD"
            echo "::error::  - DB_TEST_DATABASE"
            echo "::error::See .github/SECRETS_SETUP.md for detailed instructions."
            exit 1
          fi
          echo "✓ All required secrets are configured"

  ci:
    runs-on: ubuntu-latest
    needs: validate-secrets
    # Gate the job - only run if all required secrets are configured
    if: ${{ success() }}

    services:
      postgres:
        image: postgres:16
        env:
          # All PostgreSQL configuration must be provided via secrets
          # See .github/SECRETS_SETUP.md for configuration instructions
          POSTGRES_USER: ${{ secrets.DB_TEST_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_TEST_DATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure Database
        run: |
          php artisan config:clear
          php -r "file_put_contents('.env', str_replace('DB_CONNECTION=sqlite', 'DB_CONNECTION=pgsql', file_get_contents('.env')));"
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=${{ secrets.DB_TEST_DATABASE }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_TEST_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_TEST_PASSWORD }}" >> .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Build Assets
        run: npm run build

      - name: Backend Tests
        run: ./vendor/bin/pest

      - name: Frontend Tests
        run: npm run test:run
        env: 
          LARAVEL_BYPASS_ENV_CHECK: 1
